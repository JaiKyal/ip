spring.application.name=shoppingcart

# Render injects PORT; locally it falls back to 8080
server.port=${PORT:8080}

# Database (Neon). Values come from environment variables; see .env.example.
# Use the DIRECT host (no -pooler) with sslmode=require in DB_URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Small pool: Render free tier has ~512 MB RAM and Neon free has connection limits.
spring.datasource.hikari.maximum-pool-size=5
# Neon closes idle connections, so retire ours before it does.
spring.datasource.hikari.max-lifetime=300000

# Schema is owned by Flyway (db/migration). Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Allowed frontend origins for CORS (comma separated, exact origins, no wildcard)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Only the health endpoint is exposed, without internal details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
